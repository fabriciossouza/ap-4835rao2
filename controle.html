<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle · Acolhe Brumado</title>
<style>
  :root { --bg:#0b1220; --panel:#131c2e; --panel2:#1a2540; --tx:#e7edf7; --mut:#93a0b8; --acc:#2dd4bf; --warn:#f59e0b; --bad:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 -apple-system,system-ui,Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  body { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  #topo { position:sticky; top:0; z-index:5; background:linear-gradient(var(--bg) 85%, transparent); padding:8px 12px 6px; }
  .linha { display:flex; align-items:center; gap:8px; }
  .st { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--mut); }
  .st .d { width:8px; height:8px; border-radius:50%; background:var(--warn); }
  .st .d.ok { background:var(--ok); } .st .d.off { background:var(--bad); }
  #timer { margin-left:auto; text-align:right; }
  #timer .t { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1; }
  #timer .m { font-size:11px; color:var(--mut); }
  #timer.atrasado .t { color:var(--bad); }
  #timer.parado .t { color:var(--mut); }
  .chips { display:flex; gap:6px; margin-top:6px; }
  .chip { flex:1; text-align:center; padding:6px 0; border-radius:8px; background:var(--panel); color:var(--mut); font-size:12px; border:1px solid transparent; }
  .chip.on { color:var(--acc); border-color:var(--acc); background:#0f2a2c; }
  #cab { padding:6px 12px 0; }
  #cab .n { color:var(--acc); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  #cab h1 { margin:2px 0 4px; font-size:19px; line-height:1.25; letter-spacing:-.01em; }
  #cab .prox { font-size:12px; color:var(--mut); }
  #cab .prox b { color:var(--tx); font-weight:500; }
  #cab .tempo { font-size:12px; color:var(--warn); margin-top:4px; }
  #cab .etq { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--panel2); font-size:13px; border-left:3px solid var(--acc); }
  #corpo { padding:8px 12px 0; }
  .ficha { margin:0; padding:0; list-style:none; }
  .ficha li { position:relative; padding:7px 0 7px 16px; border-bottom:1px solid #1e2a44; font-size:15px; }
  .ficha li::before { content:""; position:absolute; left:2px; top:15px; width:6px; height:6px; border-radius:50%; background:var(--acc); }
  .ficha li.aviso { color:#fde68a; } .ficha li.aviso::before { background:var(--warn); }
  .ficha li.himas { color:#a5f3fc; } .ficha li.himas::before { background:#22d3ee; }
  .bts { display:flex; gap:6px; margin:12px 0 8px; flex-wrap:wrap; }
  .bt { padding:8px 10px; border-radius:8px; background:var(--panel); color:var(--tx); border:1px solid #223050; font-size:13px; }
  .bt.on { border-color:var(--acc); color:var(--acc); }
  .bt.warn { border-color:#7c4a03; color:#fde68a; } .bt.warn.on { border-color:var(--warn); }
  .caixa { display:none; margin:6px 0 10px; padding:10px 12px; border-radius:10px; background:var(--panel); font-size:15px; line-height:1.55; }
  .caixa.on { display:block; }
  .caixa.warn { background:#2a1c06; border:1px solid #7c4a03; }
  .caixa p { margin:0 0 10px; } .caixa p:last-child { margin:0; }
  .caixa ol, .caixa ul { margin:0 0 8px; padding-left:20px; }
  .caixa strong { color:#fff; }
  #grade { display:none; position:fixed; inset:0; z-index:9; background:rgba(5,9,18,.96); padding:14px 12px; overflow:auto; }
  #grade.on { display:block; }
  #grade .g { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }
  #grade .g button { text-align:left; padding:10px; border-radius:10px; background:var(--panel); color:var(--tx); border:1px solid #223050; font-size:13px; line-height:1.3; }
  #grade .g button.na { border-color:var(--acc); }
  #grade .g button.at { background:#0f2a2c; }
  #grade .g button.fora { opacity:.45; }
  #grade .g button b { display:block; color:var(--acc); font-size:11px; letter-spacing:.06em; margin-bottom:2px; }
  #grade .fechar { width:100%; padding:12px; border-radius:10px; background:var(--panel2); color:var(--tx); border:0; font-size:15px; }
  #barra { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 25%); }
  #barra button { height:64px; border-radius:14px; border:0; font-size:28px; font-weight:700; color:#04110f; background:var(--acc); }
  #barra .prev { flex:1; background:var(--panel2); color:var(--tx); }
  #barra .next { flex:2; }
  #barra .grid { flex:0 0 64px; background:var(--panel2); color:var(--tx); font-size:20px; }
  #barra button:active { filter:brightness(1.15); }
  #barra button:disabled { opacity:.35; }
  #ack { font-size:12px; color:var(--mut); }
  #ack.ok { color:var(--ok); } #ack.wait { color:var(--warn); } #ack.bad { color:var(--bad); font-weight:600; }
  .st .d.q { background:#64748b; }
  #srvs .d { margin-right:-2px; }
  #alerta { display:none; margin:-8px -12px 8px; background:var(--bad); color:#fff; padding:12px 14px;
            font-size:18px; font-weight:700; line-height:1.3; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #alerta.on { display:flex; align-items:center; gap:12px; }
  #alerta .tx { flex:1; }
  #alerta .tx small { display:block; font-size:13px; font-weight:400; opacity:.9; margin-top:2px; }
  #alerta button { flex:0 0 auto; height:52px; padding:0 16px; border-radius:12px; border:0; background:#fff; color:var(--bad); font-size:16px; font-weight:700; }
  #alerta button:active { filter:brightness(.9); }
  em { color:#cbd5e1; }
</style>
</head>
<body>

<div id="topo">
  <div id="alerta"><div class="tx"><span id="atx">⚠ tablet ainda no ?</span><small id="asub">olhe o tablet · toque duplo nele avança</small></div><button id="breenviar">📡 reenviar</button></div>
  <div class="linha">
    <div class="st" id="srvs"><span id="smural">mural</span></div>
    <div class="st"><span class="d" id="dtab"></span><span id="stab">tablet</span></div>
    <div id="ack">—</div>
    <div id="timer" class="parado"><div class="t">00:00</div><div class="m">toque p/ iniciar</div></div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="cab">
  <div class="n" id="cn"></div>
  <h1 id="ct"></h1>
  <div class="prox" id="cp"></div>
  <div class="tempo" id="ctempo"></div>
  <div class="etq" id="cetq"></div>
</div>

<div id="corpo">
  <ul class="ficha" id="ficha"></ul>
  <div class="bts">
    <button class="bt" id="bfala">Fala completa</button>
    <button class="bt warn" id="bcuid">⚠️ Cuidado</button>
    <button class="bt" id="bperg">Se ela perguntar</button>
    <button class="bt" id="btela">Na tela</button>
  </div>
  <div class="caixa" id="cfala"></div>
  <div class="caixa warn" id="ccuid"></div>
  <div class="caixa" id="cperg"></div>
  <div class="caixa" id="ctela"></div>
</div>

<div id="grade">
  <div style="font-weight:600">Ir para o slide</div>
  <div class="g" id="gg"></div>
  <button class="fechar" id="gfechar" style="margin-top:12px">Fechar</button>
</div>

<div id="barra">
  <button class="prev" id="bprev">‹</button>
  <button class="grid" id="bgrid">⋮⋮</button>
  <button class="next" id="bnext">›</button>
</div>

<script src="config.js?v=5"></script>
<script src="sync.js?v=5"></script>
<script src="notas.js?v=5"></script>
<script>
(function () {
  const D = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(window.NOTAS_B64), c => c.charCodeAt(0))));
  const S = D.slides, V = D.versoes, TOTAL = CFG.total;
  const $ = id => document.getElementById(id);
  const ls = { get: (k, d) => { try { const v = localStorage.getItem("ctl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
               set: (k, v) => { try { localStorage.setItem("ctl." + k, JSON.stringify(v)); } catch {} } };

  let atual = ls.get("slide", 1), versao = ls.get("versao", "25"), t0 = ls.get("t0", null);
  let ackN = null, ackAt = 0, tabAt = 0, aberto = { fala: false, cuid: false, perg: false, tela: false };
  // envio com reenvio até o tablet confirmar: {n, tentativa, timers[], semInternet}
  let envio = null;

  // --- mini-markdown: **negrito**, *itálico*, listas "1." e "-", parágrafos ---
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+?)\*/g, "$1<em>$2</em>");
  function md(txt) {
    const out = []; let lista = null, par = [];
    const fechaPar = () => { if (par.length) { out.push("<p>" + par.map(inl).join("<br>") + "</p>"); par = []; } };
    const fechaLista = () => { if (lista) { out.push("</" + lista + ">"); lista = null; } };
    (txt || "").split("\n").forEach(l => {
      const t = l.trim();
      if (!t) { fechaPar(); fechaLista(); return; }
      let m;
      if ((m = t.match(/^(\d+)\.\s+(.*)/))) { fechaPar(); if (lista !== "ol") { fechaLista(); out.push("<ol>"); lista = "ol"; } out.push("<li>" + inl(m[2]) + "</li>"); return; }
      if ((m = t.match(/^[-•]\s+(.*)/)))    { fechaPar(); if (lista !== "ul") { fechaLista(); out.push("<ul>"); lista = "ul"; } out.push("<li>" + inl(m[1]) + "</li>"); return; }
      fechaLista(); par.push(t);
    });
    fechaPar(); fechaLista(); return out.join("");
  }

  // --- versões / caminho ---
  const caminho = () => V[versao].slides;
  function proximoNoCaminho(n, dir) {
    const c = caminho();
    if (dir > 0) { const x = c.find(v => v > n); return x || null; }
    const r = [...c].reverse().find(v => v < n); return r || null;
  }
  function metaDe(n) { const m = V[versao].meta; if (m[n] != null) return m[n]; // slide fora da versão: meta do próximo dentro
    const p = proximoNoCaminho(n, 1); return p ? m[p] : null; }

  // --- render ---
  function render() {
    const s = S[atual - 1], prox = proximoNoCaminho(atual, 1);
    $("cn").textContent = "Slide " + atual + " / " + TOTAL + (caminho().includes(atual) ? "" : "  · fora da versão " + versao + " min");
    $("ct").textContent = s.titulo;
    $("cp").innerHTML = prox ? "próximo: <b>" + esc(S[prox - 1].titulo) + "</b>" : "último slide desta versão";
    $("ctempo").textContent = s.tempo ? "⏱ " + s.tempo : "";
    $("cetq").innerHTML = s.etiqueta ? inl(s.etiqueta) : "";
    $("cetq").style.display = s.etiqueta ? "" : "none";
    $("ficha").innerHTML = s.ficha.map(f => {
      const cls = f.startsWith("⚠️") ? "aviso" : (/passar a bola|Himas/.test(f) && f.startsWith("→") ? "himas" : "");
      return "<li class='" + cls + "'>" + inl(f) + "</li>";
    }).join("");
    $("cfala").innerHTML = md(s.fala);
    $("ccuid").innerHTML = s.cuidado ? md(s.cuidado) : "";
    $("bcuid").style.display = s.cuidado ? "" : "none";
    $("cperg").innerHTML = s.pergunta ? md(s.pergunta) : "";
    $("bperg").style.display = s.pergunta ? "" : "none";
    $("ctela").innerHTML = md(s.tela);
    ["fala", "cuid", "perg", "tela"].forEach(k => { $("c" + k).classList.toggle("on", aberto[k]); $("b" + k).classList.toggle("on", aberto[k]); });
    $("bprev").disabled = !proximoNoCaminho(atual, -1) && atual === 1;
    $("bnext").disabled = !proximoNoCaminho(atual, 1) && atual === TOTAL;
    document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c.dataset.v === versao));
    renderGrade(); renderAck(); renderTimer();
    window.scrollTo(0, 0);
  }
  function renderGrade() {
    $("gg").innerHTML = S.map(s => "<button data-n='" + s.n + "' class='" + (s.n === atual ? "at " : "") + (caminho().includes(s.n) ? "na" : "fora") + "'><b>slide " + s.n + "</b>" + esc(s.titulo) + "</button>").join("");
  }
  function renderAck() {
    const a = $("ack"), agora = Date.now();
    if (ackN === atual) { a.className = "ok"; a.textContent = "✓ tablet no " + atual; }
    else if (envio && envio.n === atual && envio.semInternet) { a.className = "bad"; a.textContent = "✗ não enviou"; }
    else if (envio && envio.n === atual) { a.className = "wait"; a.textContent = "enviando " + atual + "… (" + envio.tentativa + "/3)"; }
    else if (ackN !== null) { a.className = "wait"; a.textContent = "tablet no " + ackN + "…"; }
    else { a.className = ""; a.textContent = "—"; }
    const d = $("dtab"), st = $("stab"), vis = Math.max(ackAt, tabAt);
    if (vis && agora - vis < 70000) { d.className = "d ok"; st.textContent = "tablet " + Math.round((agora - vis) / 1000) + "s"; }
    else if (vis) { d.className = "d"; st.textContent = "tablet " + Math.round((agora - vis) / 60000) + "min"; }
    else { d.className = "d off"; st.textContent = "tablet ?"; }
  }
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  function renderTimer() {
    const T = $("timer"), meta = metaDe(atual);
    if (!t0) { T.className = "parado"; T.querySelector(".t").textContent = "00:00"; T.querySelector(".m").textContent = "toque p/ iniciar" + (meta != null ? " · meta " + fmt(meta * 60000) : ""); return; }
    const el = Date.now() - t0;
    T.querySelector(".t").textContent = fmt(el);
    T.querySelector(".m").textContent = meta != null ? "meta deste slide: até " + fmt(meta * 60000) : "";
    T.className = (meta != null && el > meta * 60000) ? "atrasado" : "";
  }
  setInterval(() => { renderTimer(); renderAck(); }, 1000);

  // --- ações ---
  function ir(n, enviar) {
    n = Math.max(1, Math.min(TOTAL, n));
    if (n !== atual) { atual = n; ls.set("slide", n); aberto.fala = false; aberto.cuid = false; aberto.perg = false; aberto.tela = false; }
    if (enviar) { enviarSlide(n); if (navigator.vibrate) navigator.vibrate(25); }
    if (!t0 && enviar && n > 1) { t0 = Date.now(); ls.set("t0", t0); }
    render();
  }

  // --- envio com reenvio até confirmar ---
  // 1ª tentativa na hora; se em 4 s não veio "recebi" do slide certo, reenvia (t novo); de novo aos 10 s e 20 s.
  // A partir de 10 s sem confirmação, faixa vermelha no topo. Tudo some quando chega o ✓.
  function limparEnvio() { if (envio) { envio.timers.forEach(clearTimeout); } envio = null; }
  function alerta(on, txt, sub) {
    $("alerta").classList.toggle("on", !!on);
    if (txt) $("atx").textContent = txt;
    if (sub) $("asub").textContent = sub;
    if (on && navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }
  async function publicar(n) {
    const ok = await Sync.sendSlide(n, "controle");
    if (envio && envio.n === n) { envio.semInternet = ok === 0; renderAck(); }
    if (ok === 0 && envio && envio.n === n) alerta(true, "✗ não enviou o slide " + n, "sem internet no celular? · toque duplo no tablet · tente 📡 reenviar");
    return ok;
  }
  function enviarSlide(n) {
    limparEnvio(); alerta(false);
    envio = { n, tentativa: 1, timers: [], semInternet: false };
    publicar(n);
    const de_novo = (k) => () => { if (!envio || envio.n !== n || ackN === n) return; envio.tentativa = k; renderAck(); publicar(n); };
    envio.timers.push(setTimeout(de_novo(2), 4000));
    envio.timers.push(setTimeout(() => { if (envio && envio.n === n && ackN !== n) alerta(true, "⚠ tablet ainda no " + (ackN === null ? "?" : ackN) + " — você está no " + n, "olhe o tablet · toque duplo nele avança · 📡 reenviar"); }, 10000));
    envio.timers.push(setTimeout(de_novo(3), 10500));
    envio.timers.push(setTimeout(() => { if (envio && envio.n === n && ackN !== n) { envio.tentativa = 3; publicar(n); } }, 20000));
  }
  $("breenviar").onclick = () => { enviarSlide(atual); };
  $("bnext").onclick = () => { const p = proximoNoCaminho(atual, 1); ir(p || Math.min(TOTAL, atual + 1), true); };
  $("bprev").onclick = () => { const p = proximoNoCaminho(atual, -1); ir(p || Math.max(1, atual - 1), true); };
  $("bgrid").onclick = () => $("grade").classList.add("on");
  $("gfechar").onclick = () => $("grade").classList.remove("on");
  $("gg").addEventListener("click", e => { const b = e.target.closest("button[data-n]"); if (b) { $("grade").classList.remove("on"); ir(parseInt(b.dataset.n, 10), true); } });
  ["fala", "cuid", "perg", "tela"].forEach(k => $("b" + k).onclick = () => { aberto[k] = !aberto[k]; render(); });
  $("timer").onclick = () => {
    if (!t0) { t0 = Date.now(); ls.set("t0", t0); }
    else if (confirm("Zerar o cronômetro?")) { t0 = null; ls.set("t0", null); }
    render();
  };
  ["25", "12", "5"].forEach(k => { const c = document.createElement("div"); c.className = "chip"; c.dataset.v = k; c.textContent = V[k].nome; c.onclick = () => { versao = k; ls.set("versao", k); render(); }; $("chips").appendChild(c); });
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight") $("bnext").click(); if (e.key === "ArrowLeft") $("bprev").click(); });

  // não deixar a tela do celular apagar
  let wake = null;
  const pedirWake = async () => { try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {} };
  document.addEventListener("click", pedirWake, { once: true });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pedirWake(); });

  // --- mural ---
  // pontinhos: um por servidor do mural
  const SRV = CFG.servers || [CFG.ntfy];
  $("srvs").innerHTML = SRV.map((s, i) => "<span class='d' data-s='" + i + "' title='" + s + "'></span>").join("") + "<span id='smural'>mural</span>";
  function renderSrvs() {
    const est = Sync.servers(); let vivos = 0;
    SRV.forEach((s, i) => { const e = est[s]; const d = document.querySelector("#srvs .d[data-s='" + i + "']");
      d.className = "d " + (e === "ok" ? "ok" : (e === "quarentena" ? "q" : (e === "off" ? "off" : ""))); if (e === "ok") vivos++; });
    $("smural").textContent = "mural " + vivos + "/" + SRV.length;
  }
  Sync.connect({
    // replay do histórico (último vale) ou toque duplo no tablet → acompanha
    onState: (n, de, info) => { if (info && info.replay) { ir(n, false); return; }
                                if (de === "tela") { ackN = n; ackAt = Date.now(); tabAt = ackAt; limparEnvio(); alerta(false); }   // toque duplo no tablet manda; para de reenviar
                                ir(n, false); },
    onAck: (n) => { ackN = n; ackAt = Date.now(); tabAt = ackAt; if (envio && envio.n === n) { limparEnvio(); alerta(false); } renderAck(); },
    onHb: () => { tabAt = Date.now(); renderAck(); },
    onStatus: () => renderSrvs(),
    onPublish: () => renderSrvs(),
  });
  setInterval(renderSrvs, 3000);
  render();
})();
</script>
</body>
</html>
